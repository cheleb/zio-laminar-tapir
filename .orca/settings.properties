# orca settings — edit freely, commit with the project.
# format/lint/test: one shell command per key; `off` disables the gate. Delete the stack lines (or the whole file) to re-run auto-discovery.
# planningAgent/codingAgent/reviewAgent (harness[:model]): override the global settings file; a flow's own code overrides both.
# .scalafix.conf; sbt-scalafix 0.14.9 is declared in project/plugins.sbt; .scalafix.conf sets RemoveUnused and OrganizeImports rules. Run before scalafmt so import ordering is settled first.
format = sbt scalafixAll
# .scalafmt.conf; sbt-scalafmt 2.6.2 is declared in project/plugins.sbt; .scalafmt.conf sets version 3.11.5, scala3 dialect, maxColumn 120.
format = sbt scalafmtAll
# build.sbt; Compiles main and test sources (modules/core/src/test/scala/MySuite.scala) across the root aggregate without executing tests. CI runs the narrower `sbt compile` (.github/workflows/ci.yml line 26), which does not cover test sources.
lint = sbt Test/compile
# ZIO Test suites in modules/* (JVM and Scala.js), plus end-to-end tests in examples/server (not part of the root aggregate).
test = sbt test exampleServer/test
